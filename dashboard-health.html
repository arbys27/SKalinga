    <link rel="stylesheet" href="assets/css/loader.css?v=3">

    <style>

        .maintenance-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            text-align: center;
            padding: 40px;
        }

        .maintenance-icon {
            font-size: 80px;
            color: #e74c3c;
            margin-bottom: 24px;
        }

        .maintenance-title {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 16px;
        }

        .maintenance-message {
            font-size: 18px;
            color: #666;
            max-width: 500px;
            line-height: 1.6;
        }
    </style>
    
</head>
<body>

<div class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar" id="adminSidebar"></aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-header">
            <div class="header-left">
                <h2>Health Services</h2>
                <p id="dashboard-datetime">Loading date and time...</p>
            </div>
            <div class="header-right">
                <div class="user-profile-card">
                    <div class="user-avatar-new" id="userAvatarInitials">--</div>
                    <div class="user-details">
                        <h4 id="userFullName">Loading...</h4>
                        <span class="user-role-badge" id="userRole">Administrator</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="dashboard-content">
            <div class="maintenance-container">
                <div class="maintenance-icon">
                    <i class="fas fa-heartbeat"></i>
                </div>
                <h1 class="maintenance-title">Under Maintenance</h1>
                <p class="maintenance-message">
                    The Health Services page is currently under maintenance. We're working hard to bring you health monitoring and emergency response features. Please check back soon!
                </p>
            </div>
        </div>



<script>
// ────────────────────────────────────────────────
// Load User Profile
// ────────────────────────────────────────────────
async function loadUserProfile() {
    try {
        const response = await fetch('api/get_user_profile.php');
        const result = await response.json();
        
        if (result.success) {
            const user = result.user;
            document.getElementById('userAvatarInitials').textContent = user.initials;
            document.getElementById('userFullName').textContent = user.name;
            document.getElementById('userRole').textContent = user.role;
        } else {
            console.error('Error loading user profile:', result.error);
            document.getElementById('userFullName').textContent = 'Guest User';
        }
    } catch (error) {
        console.error('Error fetching user profile:', error);
        document.getElementById('userFullName').textContent = 'Guest User';
    }
}

window.addEventListener('load', () => {
    loadUserProfile();
});

// ────────────────────────────────────────────────
// Date & Time
// ────────────────────────────────────────────────
function updateDashboardDateTime() {
    const el = document.getElementById('dashboard-datetime');
    if (!el) return;
    const now = new Date();
    el.textContent = now.toLocaleString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit', hour12: true
    });
}
setInterval(updateDashboardDateTime, 1000);
updateDashboardDateTime();

</script>

<!-- Professional Loader System -->
<script src="js/auth-guard.js" data-roles="admin,sk_official"></script>
<script src="assets/js/loader.js?v=3"></script>
<script src="js/admin-common.js"></script>
<script src="js/admin-sidebar.js"></script>
</body>
</html>
