<VirtualHost *:__PORT__>
    ServerName localhost
    DocumentRoot /var/www/html

    Alias /healthz /var/www/html/health.php
    Alias /SKalinga/ /var/www/html/
    RedirectMatch 302 ^/$ /SKalinga/

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/html/(uploads|assets/images/events)(/|$)">
        Options -Indexes
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>

    <Directory /var/www/html/uploads/incidents>
        Require all denied
    </Directory>

    <Directory /var/www/html/uploads/printing>
        Require all denied
    </Directory>

    php_admin_flag display_errors off
    php_admin_flag log_errors on
    php_admin_value error_log /proc/self/fd/2

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
