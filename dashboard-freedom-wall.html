<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#228B57">
  <title>Freedom Wall Moderation | SKalinga</title>
  <link rel="stylesheet" href="assets/css/loader.css?v=3">
  <style>
    :root{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#16303f;background:#f4faf6}
    *{box-sizing:border-box}body{margin:0}.wrap{width:min(1100px,calc(100% - 32px));margin:28px auto 70px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#228b57;font-weight:700;text-decoration:none}
    header,.panel{background:#fff;border:1px solid #e3ece7;border-radius:20px;padding:clamp(18px,4vw,28px);box-shadow:0 6px 24px #228b5710}
    header{background:linear-gradient(130deg,#228b57,#0f4d31);color:white;margin-bottom:18px}h1{margin:0 0 6px;font-size:clamp(27px,5vw,38px)}header p{margin:0;color:#e5fff0}
    .panel h2{margin:0 0 16px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .filters button,.btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}.filters button{background:#e9f7ef;color:#176d43}.filters button[aria-pressed=true]{background:#228b57;color:white}
    .list{display:grid;gap:14px}.post{border:1px solid #dce9e0;border-radius:16px;padding:16px}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.head h3{margin:8px 0;font-size:19px;overflow-wrap:anywhere}.tag{background:#e9f7ef;color:#176d43;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700}.state{font-size:12px;font-weight:800;text-transform:uppercase}.pending{color:#a76c00}.approved{color:#228b57}.rejected{color:#c0395e}.hidden-state{color:#7b6670}
    .info,.date{font-size:13px;color:#5f7788}.info{margin:6px 0 12px}.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;margin:0}.reason{width:100%;margin-top:12px;min-height:68px;border:1px solid #bdcec4;border-radius:10px;padding:10px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{background:#228b57;color:white}.btn.reject{background:#ff6b9d;color:#391426}.btn.hide{background:#5dade2;color:#123445}.notice{padding:12px;border-radius:10px;background:#e9f7ef;color:#176d43;margin-bottom:12px}.error{background:#fff0f5;color:#a52e54}.empty{color:#5f7788}.hidden{display:none!important}
    @media(max-width:600px){.wrap{margin-top:14px}.top{align-items:flex-start}}
  </style>
</head>
<body class="is-loading">
  <main class="wrap">
    <nav class="top"><a href="admin-dashboard.html">← Admin Dashboard</a><span id="moderator-name" class="info"></span></nav>
    <header><h1>Freedom Wall Moderation</h1><p>Review youth posts and keep the public board safe and respectful.</p></header>
    <section class="panel">
      <h2>Submissions</h2>
      <div id="message" class="notice hidden" role="status"></div>
      <div class="filters" aria-label="Filter submissions">
        <button type="button" data-status="all" aria-pressed="true">All</button>
        <button type="button" data-status="pending" aria-pressed="false">Pending</button>
        <button type="button" data-status="approved" aria-pressed="false">Approved</button>
        <button type="button" data-status="rejected" aria-pressed="false">Rejected</button>
      </div>
      <div id="posts" class="list" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const target=document.getElementById('posts'),message=document.getElementById('message');let filter='all',csrfToken='';
    const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node};
    async function api(url,options={}){const response=await fetch(url,{credentials:'same-origin',...options});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message||'The request could not be completed.');return data}
    async function load(){target.replaceChildren();target.appendChild(el('p','empty','Loading submissions…'));try{const result=await api(`api/freedom_wall/list_admin.php?status=${encodeURIComponent(filter)}`);target.replaceChildren();if(!result.data.length){target.appendChild(el('p','empty','No submissions in this view.'));return}result.data.forEach(renderPost)}catch(error){target.replaceChildren(el('p','notice error',error.message))}}
    function renderPost(post){const card=el('article','post'),head=el('div','head'),state=el('span',`state ${post.is_hidden?'hidden-state':post.status}`,post.is_hidden?'Hidden':post.status);head.append(el('span','tag',post.category),state);card.append(head,el('h3','',post.title));const name=[post.firstname,post.lastname].filter(Boolean).join(' ')||'Youth member';const contact=[post.voter_id?`Voter ID: ${post.voter_id}`:'',post.phone?`Mobile: ${post.phone}`:''].filter(Boolean).join(' · ')||'No voter ID or mobile on file';card.append(el('div','info',`${name} · ${contact}`),el('p','body',post.body),el('div','date',`Submitted ${new Date(post.created_at).toLocaleString()}`));if(post.rejection_reason)card.append(el('div','info',`Moderation reason: ${post.rejection_reason}`));
      if(post.status==='pending'){const reason=el('textarea','reason');reason.maxLength=2000;reason.placeholder='Optional rejection reason';reason.setAttribute('aria-label','Rejection reason');const actions=el('div','actions'),approve=el('button','btn','Approve'),reject=el('button','btn reject','Reject');approve.type=reject.type='button';approve.addEventListener('click',()=>moderate(post.id,'approve',''));reject.addEventListener('click',()=>moderate(post.id,'reject',reason.value));actions.append(approve,reject);card.append(reason,actions)}
      if(post.status==='approved'&&!post.is_hidden){const reason=el('textarea','reason');reason.maxLength=2000;reason.placeholder='Optional reason for hiding this post';reason.setAttribute('aria-label','Reason for hiding post');const hide=el('button','btn hide','Hide from public board');hide.type='button';hide.addEventListener('click',()=>moderate(post.id,'hide',reason.value));const actions=el('div','actions');actions.appendChild(hide);card.append(reason,actions)}
      target.appendChild(card)}
    async function moderate(id,action,reason){message.classList.add('hidden');try{csrfToken=csrfToken||((await api('api/csrf_token.php')).csrf_token);await api('api/freedom_wall/moderate.php',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({id,action,reason})});message.textContent='Moderation action saved.';message.classList.remove('hidden','error');await load()}catch(error){message.textContent=error.message;message.classList.remove('hidden');message.classList.add('error')}}
    document.querySelectorAll('[data-status]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.status;document.querySelectorAll('[data-status]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));load()}));
    fetch('api/me.php',{credentials:'same-origin'}).then(response=>{if(!response.ok)throw new Error('Unable to verify your session.');return response.json()}).then(result=>{if(!result.authenticated)throw new Error('Please sign in again.');document.getElementById('moderator-name').textContent=result.user.name||'Moderator'}).catch(error=>{message.textContent=error.message;message.classList.remove('hidden');message.classList.add('error')});load();
  </script>
  <script src="js/auth-guard.js" data-roles="admin,sk_official"></script>
  <script src="assets/js/loader.js?v=3"></script>
</body>
</html>
