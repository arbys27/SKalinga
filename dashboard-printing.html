<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKalinga - Printing Services Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="/SKalinga/assets/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/SKalinga/assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/SKalinga/assets/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/SKalinga/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/SKalinga/assets/icons/site.webmanifest">
<meta name="msapplication-config" content="/SKalinga/assets/icons/browserconfig.xml">
<meta name="theme-color" content="#FF6B9D">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
<link rel="stylesheet" href="assets/css/admin-theme.css">
<link rel="stylesheet" href="assets/css/loader.css?v=3">
<style>
.pm,.pm-modal{--g:#228B57;--gd:#0F4D31;--mint:#A8E6CF;--pk:#FF6B9D;--pkd:#E04F7E;--ink:#16303F;--mu:#5F7788;--ln:#E3ECE7;--mono:"JetBrains Mono",ui-monospace,monospace}
.pm *,.pm-modal *{box-sizing:border-box}
.pm [hidden],.pm-modal [hidden]{display:none!important}
.pm :focus-visible,.pm-modal :focus-visible{outline:3px solid var(--pkd);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.92em}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
@media(min-width:900px){.stats{grid-template-columns:repeat(4,1fr);gap:16px}}
.stat{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--ln);border-radius:20px;background:#fff;box-shadow:0 2px 12px rgba(34,139,87,.06)}
.stat .si{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:#e9f7ef;color:var(--g);font-size:18px;flex:none}
.stat.pink .si{background:#ffe9f1;color:var(--pkd)}.stat.amber .si{background:#fff4d6;color:#a86a00}.stat.sky .si{background:#e3f1fb;color:#14537e}
.stat b{display:block;font-size:26px;line-height:1;letter-spacing:-.03em;color:var(--ink)}
.stat span{display:block;margin-top:4px;color:var(--mu);font-size:12.5px;font-weight:600}

.bar{display:grid;gap:12px;margin-bottom:14px}
@media(min-width:900px){.bar{grid-template-columns:1fr auto;align-items:center}}
.find{position:relative;display:block;max-width:460px}
.find i{position:absolute;left:16px;top:50%;margin-top:-7px;color:var(--mu);font-size:14px;pointer-events:none}
.find input{width:100%;min-height:46px;padding:0 16px 0 42px;border:1.5px solid var(--ln);border-radius:14px;background:#fff;font:inherit;color:var(--ink)}
.find input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(34,139,87,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border:0;border-radius:14px;font:600 14px inherit;font-family:inherit;cursor:pointer;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pink{background:var(--pk);color:var(--ink);box-shadow:0 8px 20px rgba(255,107,157,.35)}.btn.pink:hover{background:#ff82ae}
.btn.green{background:var(--g);color:#fff}.btn.green:hover{background:var(--gd)}
.btn.soft{background:#f1f6f3;color:var(--ink)}.btn.soft:hover{background:#e3ece7}
.btn.red{background:#d64545;color:#fff}.btn.red:hover{background:#b93636}
.btn:disabled{opacity:.6;cursor:wait}
.spin i{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1.5px solid var(--ln);border-radius:999px;background:#fff;color:var(--ink);font:600 13px inherit;font-family:inherit;cursor:pointer}
.chip em{font-style:normal;min-width:22px;padding:1px 7px;border-radius:999px;background:#eef3f0;color:var(--mu);font-size:11.5px;text-align:center}
.chip[aria-pressed="true"]{border-color:var(--g);background:var(--g);color:#fff}.chip[aria-pressed="true"] em{background:rgba(255,255,255,.22);color:#fff}

.tw{border:1px solid var(--ln);border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 2px 12px rgba(34,139,87,.06)}
.tw .scroll{overflow-x:auto}
table.pt{width:100%;border-collapse:collapse;font-size:14px}
.pt th{padding:13px 16px;background:#f4fbf7;color:var(--mu);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-align:left;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid var(--ln)}
.pt td{padding:14px 16px;border-bottom:1px solid #eef3f0;color:var(--ink);vertical-align:middle}
.pt tbody tr:last-child td{border-bottom:0}.pt tbody tr:hover{background:#fafdfb}
.who{display:flex;align-items:center;gap:12px}
.av{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:#e9f7ef;color:var(--g);font-weight:700;flex:none}
.who b{display:block;font-weight:600}.who span{color:var(--mu);font-size:12.5px}
.specs{color:var(--mu);font-size:13px}
.file{display:inline-flex;align-items:center;gap:8px;max-width:220px;padding:6px 12px;border-radius:12px;background:#f1f6f3;color:var(--ink)!important;font-size:13px;font-weight:600;text-decoration:none}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file:hover{background:var(--g);color:#fff!important}
.file i{color:var(--pkd)}.file:hover i{color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.pending{background:#fff4d6;color:#7a5600}.pill.completed{background:#dff5e8;color:var(--gd)}
.ab{display:flex;gap:6px}
.ib{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:12px;background:#f1f6f3;color:var(--ink);cursor:pointer;transition:background .15s,color .15s}
.ib:hover{background:var(--g);color:#fff}.ib.scan:hover{background:var(--pk);color:var(--ink)}.ib.del:hover{background:#d64545;color:#fff}
.empty{padding:44px 20px;text-align:center;color:var(--mu)}
.empty i{display:block;margin-bottom:10px;font-size:30px;color:#b9d9c8}
@media(max-width:860px){
  .pt thead{display:none}
  .pt,.pt tbody,.pt tr,.pt td{display:block;width:100%}
  .pt tr{padding:14px 16px;border-bottom:1px solid var(--ln)}.pt tr:last-child{border-bottom:0}
  .pt td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:5px 0;border:0;text-align:right}
  .pt td::before{content:attr(data-l);color:var(--mu);font-size:12px;font-weight:700;text-align:left;flex:none}
  .pt td.nl::before{display:none}.pt td.ab-td{justify-content:flex-end;padding-top:10px}
}

.pm-modal{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,77,49,.55);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;font-family:inherit}
.pm-modal.on{opacity:1;visibility:visible}
.box{position:relative;width:min(100%,520px);max-height:92vh;overflow-y:auto;padding:26px;border-radius:24px;background:#fff;color:var(--ink);transform:translateY(12px);transition:transform .25s}
.pm-modal.on .box{transform:none}.box.sm{width:min(100%,420px)}
.box h2{margin:0 44px 6px 0;font-size:22px;letter-spacing:-.02em}
.box>p.lead{margin:0 0 16px;color:var(--mu);font-size:14px}
.cl{position:absolute;top:14px;right:14px;display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--ln);border-radius:50%;background:#fff;color:var(--mu);cursor:pointer}.cl:hover{color:var(--pkd)}
.det{display:grid;gap:0;margin:0}
.det div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px dashed var(--ln);font-size:14px}
.det div:last-child{border:0}.det dt{color:var(--mu)}.det dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.docs{display:flex;align-items:center;gap:12px;margin:16px 0 0;padding:14px;border-radius:16px;background:#f4fbf7;border:1.5px solid #cfe9db}
.docs i{font-size:26px;color:var(--pkd)}.docs b{display:block;overflow-wrap:anywhere}.docs span{color:var(--mu);font-size:12.5px}
.fa-end{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.req{display:flex;gap:12px;align-items:center;margin:0 0 14px;padding:14px;border-radius:16px;background:#fff0f5}
.req i{color:var(--pkd);font-size:20px}.req b{display:block}.req span{color:var(--mu);font-size:13px}
.f label{display:block;margin:0 0 6px;font-weight:600;font-size:13px}
.f input{width:100%;min-height:50px;padding:0 16px;border:1.5px solid var(--ln);border-radius:14px;background:#fff;font:600 16px var(--mono);color:var(--ink);text-transform:uppercase}
.f input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(34,139,87,.14)}
.msg{min-height:20px;margin:10px 0 0;font-size:13.5px;font-weight:600;color:#b42318}
.ok{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px;border:1.5px solid #b9d9c8;border-radius:16px;background:#e9f7ef}
.ok>i{color:var(--g);font-size:22px;margin-top:2px}.ok h3{margin:0 0 4px;font-size:15px}.ok p{margin:2px 0;font-size:13.5px}.ok small{display:block;margin-top:8px;color:var(--mu)}
#toastContainer{position:fixed;z-index:10000;right:20px;bottom:20px;display:grid;gap:10px;width:min(360px,calc(100% - 40px))}
.toast{padding:14px 16px;border-radius:14px;background:#fff;border-left:4px solid var(--g);box-shadow:0 12px 32px rgba(22,48,63,.2);font-size:14px;font-weight:600}
.toast.error{border-color:#d64545}.toast.warning{border-color:#e0a100}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app-container">
  <aside class="sidebar" id="adminSidebar"></aside>
  <main class="main-content">
    <header class="top-header">
      <div class="header-left"><h2>Printing Services Management</h2><p id="dashboard-datetime">Loading date and time...</p></div>
      <div class="header-right"><div class="user-profile-card"><div class="user-avatar-new" id="userAvatarInitials">--</div><div class="user-details"><h4 id="userFullName">Loading...</h4><span class="user-role-badge" id="userRole">Administrator</span></div></div></div>
    </header>

    <div class="dashboard-content pm">
      <section class="stats" aria-label="Print request summary">
        <div class="stat sky"><span class="si"><i class="fas fa-print"></i></span><div><b id="sTotal">0</b><span>Total requests</span></div></div>
        <div class="stat amber"><span class="si"><i class="fas fa-hourglass-half"></i></span><div><b id="sPending">0</b><span>Pending</span></div></div>
        <div class="stat"><span class="si"><i class="fas fa-circle-check"></i></span><div><b id="sDone">0</b><span>Completed</span></div></div>
        <div class="stat pink"><span class="si"><i class="fas fa-calendar-day"></i></span><div><b id="sToday">0</b><span>Received today</span></div></div>
      </section>

      <div class="bar">
        <label class="find"><span style="position:absolute;width:1px;height:1px;overflow:hidden">Search requests</span><i class="fas fa-magnifying-glass"></i><input type="search" id="searchInput" placeholder="Search by member ID, name or document" autocomplete="off"></label>
        <button class="btn green" id="refreshBtn" type="button"><i class="fas fa-rotate"></i><span>Refresh requests</span></button>
      </div>

      <div class="chips" id="statusChips" role="group" aria-label="Filter by status">
        <button class="chip" type="button" data-s="" aria-pressed="true">All<em id="cAll">0</em></button>
        <button class="chip" type="button" data-s="Pending" aria-pressed="false">Pending<em id="cPending">0</em></button>
        <button class="chip" type="button" data-s="Completed" aria-pressed="false">Completed<em id="cDone">0</em></button>
      </div>

      <div class="tw"><div class="scroll">
        <table class="pt admin-table" id="printingTable">
          <thead><tr><th>Youth</th><th>Print details</th><th>Sent</th><th>Status</th><th>Document</th><th>Actions</th></tr></thead>
          <tbody id="printingTableBody"></tbody>
        </table>
      </div></div>
    </div>
  </main>
</div>

<!-- View details -->
<div class="pm-modal" id="viewDetailsModal" role="dialog" aria-modal="true" aria-labelledby="viewTitle">
  <div class="box">
    <button class="cl" id="closeViewDetails" type="button" aria-label="Close"><i class="fas fa-xmark"></i></button>
    <h2 id="viewTitle">Print request</h2>
    <dl class="det" id="detailsContent"></dl>
    <div class="docs" id="docPreview"></div>
    <div class="fa-end" id="viewActions"></div>
  </div>
</div>

<!-- Confirm -->
<div class="pm-modal" id="confirmationModal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="box sm">
    <h2 id="confirmTitle">Confirm action</h2><p class="lead" id="confirmMessage"></p>
    <div class="fa-end"><button id="confirmCancelBtn" class="btn soft" type="button">Cancel</button><button id="confirmOkBtn" class="btn red" type="button"><i class="fas fa-trash"></i><span id="confirmOkText">Delete</span></button></div>
  </div>
</div>

<div id="toastContainer" aria-live="polite"></div>

<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const safeUrl=u=>/^(https?:\/\/|\/|\.\/|[\w][\w\-./%]*$)/i.test(String(u||'').trim())&&!/^\s*(javascript|data):/i.test(u);
let printRequests=[],statusFilter='',csrfToken='';

function notify(msg,type='success'){
  if(typeof showAlert==='function'){showAlert(msg,type);return}
  const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;$('toastContainer').appendChild(t);setTimeout(()=>t.remove(),4000);
}
const openM=id=>{$(id).classList.add('on');document.body.style.overflow='hidden'};
const closeM=id=>{$(id).classList.remove('on');if(!document.querySelector('.pm-modal.on'))document.body.style.overflow=''};
$('closeViewDetails').onclick=()=>closeM('viewDetailsModal');
document.querySelectorAll('.pm-modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeM(m.id)}));
addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.pm-modal.on').forEach(m=>closeM(m.id))});
function showConfirm(message,onConfirm,label='Delete'){
  $('confirmMessage').textContent=message;$('confirmOkText').textContent=label;openM('confirmationModal');$('confirmCancelBtn').focus();
  $('confirmOkBtn').onclick=()=>{closeM('confirmationModal');if(onConfirm)onConfirm()};
  $('confirmCancelBtn').onclick=()=>closeM('confirmationModal');
}

function updateDashboardDateTime(){
  $('dashboard-datetime').textContent=new Date().toLocaleString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
}
setInterval(updateDashboardDateTime,30000);updateDashboardDateTime();

/* ---- data ---- */
async function loadPrintRequests(){
  try{
    const r=await fetch('api/get_print_requests.php'),d=await r.json();
    if(d.success){printRequests=d.data||[]}else{console.error('Error loading print requests:',d.error);printRequests=[]}
  }catch(e){console.error('Error fetching print requests:',e);notify('Error loading requests','error')}
  filterTable();
}
const dt=(d,o)=>{const x=new Date(d);return isNaN(x)?'—':x.toLocaleString('en-US',o||{dateStyle:'medium',timeStyle:'short'})};
const reqRef=id=>'REQ-'+String(id).padStart(4,'0');
const ext=n=>String(n||'').split('.').pop().toLowerCase();
const fileIcon=n=>({pdf:'fa-file-pdf',doc:'fa-file-word',docx:'fa-file-word',jpg:'fa-file-image',jpeg:'fa-file-image',png:'fa-file-image',txt:'fa-file-lines'})[ext(n)]||'fa-file';
const specs=r=>[r.print_type,r.paper_size,r.copies?`${r.copies} ${Number(r.copies)===1?'copy':'copies'}`:''].filter(Boolean).join(' · ')||'—';

/* ---- render ---- */
function renderStats(){
  const p=printRequests.filter(r=>r.status==='Pending').length,c=printRequests.filter(r=>r.status==='Completed').length,today=new Date().toDateString();
  $('sTotal').textContent=printRequests.length;$('sPending').textContent=p;$('sDone').textContent=c;
  $('sToday').textContent=printRequests.filter(r=>new Date(r.created_at).toDateString()===today).length;
  $('cAll').textContent=printRequests.length;$('cPending').textContent=p;$('cDone').textContent=c;
}
function renderPrintTable(list){
  const tb=$('printingTableBody');
  if(!list.length){tb.innerHTML=`<tr><td colspan="6" class="empty nl"><i class="fas fa-print"></i>No print requests found</td></tr>`;return}
  tb.innerHTML=list.map(r=>{
    const done=r.status==='Completed',id=esc(r.request_id),name=r.member_name||'Unknown';
    const link=r.file_path&&safeUrl(r.file_path)?`<a class="file" href="${esc(r.file_path)}" target="_blank" rel="noopener" download><i class="fas ${fileIcon(r.file_name)}"></i><span>${esc(r.file_name||'Document')}</span></a>`:'—';
    return `<tr>
      <td data-l="Youth" class="nl"><div class="who"><span class="av">${esc(name.charAt(0).toUpperCase())}</span><div><b>${esc(name)}</b><span class="mono">${esc(r.member_id)}</span></div></div></td>
      <td data-l="Details"><div><b style="font-weight:600">${esc(r.document_title||'Untitled')}</b><div class="specs">${esc(specs(r))}</div></div></td>
      <td data-l="Sent">${esc(dt(r.created_at,{dateStyle:'short',timeStyle:'short'}))}</td>
      <td data-l="Status"><span class="pill ${done?'completed':'pending'}">${done?'Completed':'Pending'}</span></td>
      <td data-l="Document">${link}</td>
      <td class="ab-td nl"><div class="ab">
        <button class="ib" type="button" data-act="view" data-id="${id}" aria-label="View details" title="View details"><i class="fas fa-eye"></i></button>
        ${done?'':`<button class="ib" type="button" data-act="complete" data-id="${id}" aria-label="Mark completed" title="Mark completed"><i class="fas fa-check"></i></button>`}
        <button class="ib del" type="button" data-act="delete" data-id="${id}" aria-label="Delete request" title="Delete request"><i class="fas fa-trash"></i></button></div></td></tr>`;
  }).join('');
}
function filterTable(){
  renderStats();
  const q=$('searchInput').value.toLowerCase().trim();
  renderPrintTable(printRequests.filter(r=>`${r.member_id} ${r.member_name} ${r.file_name} ${r.document_title}`.toLowerCase().includes(q)&&(!statusFilter||r.status===statusFilter)));
}
$('searchInput').addEventListener('input',filterTable);
$('statusChips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;statusFilter=b.dataset.s;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));filterTable()});
$('printingTableBody').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  ({view:viewDetails,complete:id=>updateStatus(id,'Completed'),delete:deleteRequest})[b.dataset.act](b.dataset.id);
});
$('refreshBtn').onclick=async()=>{const b=$('refreshBtn');b.classList.add('spin');b.disabled=true;await loadPrintRequests();b.classList.remove('spin');b.disabled=false;notify('Requests refreshed')};
const recOf=id=>printRequests.find(r=>String(r.request_id)===String(id));

/* ---- view ---- */
function viewDetails(id){
  const r=recOf(id);if(!r)return notify('Request not found','error');
  const done=r.status==='Completed';
  $('detailsContent').innerHTML=[['Request ID',reqRef(r.request_id)],['Member ID',r.member_id],['Name',r.member_name],['Document title',r.document_title],['Date and time sent',dt(r.created_at,{dateStyle:'full',timeStyle:'short'})],['Print type',r.print_type||'N/A'],['Paper size',r.paper_size||'N/A'],['Copies',r.copies||'1']]
    .map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')+`<div><dt>Status</dt><dd><span class="pill ${done?'completed':'pending'}">${done?'Completed':'Pending'}</span></dd></div>`;
  const ok=r.file_path&&safeUrl(r.file_path);
  $('docPreview').innerHTML=`<i class="fas ${fileIcon(r.file_name)}"></i><div style="flex:1;min-width:0"><b>${esc(r.file_name||'Document')}</b><span>${esc(ext(r.file_name).toUpperCase()||'FILE')} document</span></div>${ok?`<a class="btn soft" href="${esc(r.file_path)}" target="_blank" rel="noopener" download="${esc(r.file_name||'')}"><i class="fas fa-download"></i>Download</a>`:''}`;
  $('viewActions').innerHTML=done?'':`<button class="btn pink" type="button" id="vComplete"><i class="fas fa-check"></i>Mark completed</button>`;
  if(!done)$('vComplete').onclick=async()=>{if(await updateStatus(id,'Completed'))closeM('viewDetailsModal')};
  openM('viewDetailsModal');
}

/* ---- status ---- */
async function updateStatus(requestId,newStatus){
  if(!recOf(requestId)){notify('Request not found','error');return false}
  try{
    const csrf=await getCsrfToken();
    const r=await fetch('api/update_print_status.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({request_id:requestId,status:newStatus})}),d=await r.json();
    if(d.success){notify(`Status updated to ${newStatus}!`);await loadPrintRequests();return true}
    notify(d.message||'Failed to update status','error');
  }catch(e){console.error('Error updating status:',e);notify('Error updating status','error')}
  return false;
}

async function getCsrfToken(){
  if(csrfToken)return csrfToken;
  const response=await fetch('api/csrf_token.php',{credentials:'same-origin',cache:'no-store'});
  const data=await response.json();
  if(!response.ok||!data.success||!data.csrf_token)throw new Error(data.message||'Unable to prepare a secure request.');
  csrfToken=data.csrf_token;
  return csrfToken;
}
/* ---- delete ---- */
function deleteRequest(id){
  showConfirm('Are you sure you want to delete this request? This action cannot be undone.',async()=>{
    try{
      const r=await fetch('api/delete_print_request.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:Number(id)})}),d=await r.json();
      if(d.success){notify('Request deleted successfully.');loadPrintRequests()}else notify(d.message||'Failed to delete request','error');
    }catch(e){console.error('Error deleting request:',e);notify('Error deleting request. Please try again.','error')}
  });
}

/* ---- profile + init ---- */
async function loadUserProfile(){
  try{const r=await fetch('api/get_user_profile.php'),d=await r.json();
    if(d.success){$('userAvatarInitials').textContent=d.user.initials;$('userFullName').textContent=d.user.name;$('userRole').textContent=d.user.role}
    else{console.error('Error loading user profile:',d.error);$('userFullName').textContent='Guest User'}}
  catch(e){console.error('Error fetching user profile:',e);$('userFullName').textContent='Guest User'}
}
window.addEventListener('load',()=>{loadUserProfile();loadPrintRequests()});
