<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Continue sign in | SKalinga</title>
</head>
<body>
  <p>Sign-in verification has moved to the email code screen.</p>
  <p><a id="continueLink" href="login.html">Continue to sign in</a></p>
  <script>
    const params = new URLSearchParams(location.search);
    const redirect = params.get('redirect') || '';
    const target = `login.html?reauth=1${redirect ? `&redirect=${encodeURIComponent(redirect)}` : ''}`;
    document.getElementById('continueLink').href = target;
    location.replace(target);
  </script>
</body>
</html>
