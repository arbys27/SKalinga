    <!-- Your shared dashboard CSS -->

    <style>

        .maintenance-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            text-align: center;
            padding: 40px;
        }

        .maintenance-icon {
            font-size: 80px;
            color: #228B57;
            margin-bottom: 24px;
        }

        .maintenance-title {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 16px;
        }

        .maintenance-message {
            font-size: 18px;
            color: #666;
            max-width: 500px;
            line-height: 1.6;
        }
    </style>
    
</head>
<body>

<div class="app-container">
        <aside class="sidebar" id="adminSidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h2>Settings</h2>
                    <p id="dashboard-datetime">Loading date and time...</p>
                </div>
                <div class="header-right">
                <div class="user-profile-card">
                    <div class="user-avatar-new" id="userAvatarInitials">--</div>
                    <div class="user-details">
                        <h4 id="userFullName">Loading...</h4>
                        <span class="user-role-badge" id="userRole">Administrator</span>
                    </div>
                </div>
            </div>
            </header>

        <div class="dashboard-content">
            <section id="mailUsageCard" class="maintenance-container" hidden aria-labelledby="mailUsageTitle">
                <h1 id="mailUsageTitle" class="maintenance-title">Email OTP usage</h1>
                <p id="mailUsageCount" class="maintenance-message" aria-live="polite"></p>
                <button type="button" class="btn btn-primary" id="sendTestEmail">Send test email to my account</button>
                <p id="mailTestResult" role="status" aria-live="polite"></p>
            </section>
            <div class="maintenance-container">
                <div class="maintenance-icon">
                    <i class="fas fa-tools"></i>
                </div>
                <h1 class="maintenance-title">Under Maintenance</h1>
                <p class="maintenance-message">
                    The Settings page is currently under maintenance. We're working hard to bring you new features and improvements. Please check back soon!
                </p>
            </div>
        </div>

    <script>
// ────────────────────────────────────────────────
// Load User Profile
// ────────────────────────────────────────────────
async function loadUserProfile() {
    try {
        const response = await fetch('api/get_user_profile.php');
        const result = await response.json();
        
        if (result.success) {
            const user = result.user;
            document.getElementById('userAvatarInitials').textContent = user.initials;
            document.getElementById('userFullName').textContent = user.name;
            document.getElementById('userRole').textContent = user.role;
        } else {
            console.error('Error loading user profile:', result.error);
            document.getElementById('userFullName').textContent = 'Guest User';
        }
    } catch (error) {
        console.error('Error fetching user profile:', error);
        document.getElementById('userFullName').textContent = 'Guest User';
    }
}

window.addEventListener('load', () => {
    loadUserProfile();
});

// ────────────────────────────────────────────────
// Date & Time
// ────────────────────────────────────────────────
function updateDashboardDateTime() {
    const el = document.getElementById('dashboard-datetime');
    if (!el) return;
    const now = new Date();
    el.textContent = now.toLocaleString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit', hour12: true
    });
}
setInterval(updateDashboardDateTime, 1000);
updateDashboardDateTime();

// ────────────────────────────────────────────────
// Logout Confirmation
// ────────────────────────────────────────────────

</script>
<script>
(() => {
    const card = document.getElementById('mailUsageCard');
    const count = document.getElementById('mailUsageCount');
    const result = document.getElementById('mailTestResult');
    const button = document.getElementById('sendTestEmail');
    const showUsage = usage => {
        count.textContent = `${usage.count} of ${usage.limit} EmailJS requests used this month (${usage.percent}%).`;
    };

    fetch('api/admin/mail_usage.php', { credentials: 'same-origin', cache: 'no-store' })
        .then(async response => {
            const data = await response.json();
            if (response.ok && data.success) {
                card.hidden = false;
                showUsage(data.usage);
            }
        })
        .catch(() => {});

    button.addEventListener('click', async () => {
        button.disabled = true;
        result.textContent = 'Sending test email...';
        try {
            const csrfResponse = await fetch('api/csrf_token.php', { credentials: 'same-origin', cache: 'no-store' });
            const csrf = await csrfResponse.json();
            if (!csrfResponse.ok || !csrf.success) throw new Error('Unable to prepare a secure request.');
            const body = new FormData();
            body.set('csrf_token', csrf.csrf_token);
            const response = await fetch('api/admin/send_test_email.php', {
                method: 'POST',
                body,
                credentials: 'same-origin'
            });
            const data = await response.json();
            if (data.usage) showUsage(data.usage);
            const providerResult = data.provider_result;
            result.textContent = data.success
                ? `${data.message} EmailJS HTTP ${data.status}: ${data.response || '(empty response)'}`
                : `${data.message || 'Test email failed.'}${providerResult ? ` EmailJS HTTP ${providerResult.status}: ${providerResult.response || '(empty response)'}` : ''}`;
        } catch (error) {
            result.textContent = error.message || 'Unable to send the test email.';
        } finally {
            button.disabled = false;
        }
    });
})();
</script>

<!-- Professional Loader System -->

<script src="assets/js/loader.js?v=3"></script>

</html>
